name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

  test:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # Credencial de um Postgres efêmero, isolado ao runner e destruído ao fim do job.
          # Sobrescrevível via secret; o fallback permite rodar o CI em forks sem o secret.
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'Strong_Passw0rd!' }}
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      CF_TEST_POSTGRES: "Host=localhost;Port=5432;Database={DB};Username=postgres;Password=${{ secrets.CI_POSTGRES_PASSWORD || 'Strong_Passw0rd!' }}"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Install local OCR runtime
        run: |
          sudo apt-get update && sudo apt-get install -y python3-venv python3-pil tesseract-ocr tesseract-ocr-por
          python3 -m venv --system-site-packages /tmp/invoice-python
          /tmp/invoice-python/bin/pip install "pypdf[crypto]==6.10.0"
          echo "/tmp/invoice-python/bin" >> "$GITHUB_PATH"

      - name: Test with coverage gate
        shell: pwsh
        run: ./scripts/coverage-gate.ps1 -Threshold 80

      - name: Post test failure details to PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'TestResults/coverage-collector';
            let body = '## CI Test Failure Diagnostic\n\n';
            function walk(d) {
              let out = [];
              try { for (const f of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, f.name); if (f.isDirectory()) out.push(...walk(p)); else if (f.name.endsWith('.trx')) out.push(p); } } catch(e){}
              return out;
            }
            for (const f of walk(dir)) {
              const xml = fs.readFileSync(f, 'utf8');
              const total = (xml.match(/outcome="/g)||[]).length;
              const failMatches = [...xml.matchAll(/UnitTestResult[^>]*outcome="Failed"[^>]*testName="([^"]+)"/g)];
              const failMatches2 = [...xml.matchAll(/UnitTestResult[^>]*testName="([^"]+)"[^>]*outcome="Failed"/g)];
              const fails = [...new Set([...failMatches.map(m=>m[1]), ...failMatches2.map(m=>m[1])])];
              body += `**${path.basename(f)}**: ${total} results, ${fails.length} failed\n\n`;
              for (const t of fails.slice(0, 30)) body += `- \`${t}\`\n`;
              const errBlocks = [...xml.matchAll(/<Message>([\s\S]*?)<\/Message>/g)];
              if (errBlocks.length > 0) {
                body += '\n<details><summary>Error messages</summary>\n\n```\n';
                for (const e of errBlocks.slice(0, 10)) body += e[1].substring(0, 500) + '\n---\n';
                body += '```\n</details>\n\n';
              }
            }
            try {
              body += '### Coverage\n```\n' + fs.readFileSync('TestResults/coverage-report/Summary.txt','utf8').substring(0,2000) + '\n```\n';
            } catch(e) { body += '_No coverage report (tests failed before coverage)_\n'; }
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-results
          path: |
            TestResults/coverage-collector/**/*.trx
          if-no-files-found: ignore

      - name: Publish validated API contract
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: contracts/openapi.json
          if-no-files-found: error

      - name: Preserve coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: TestResults/coverage-report/
          if-no-files-found: error

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check vulnerable packages
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem src -Recurse -Filter *.csproj | ForEach-Object {
            $report = dotnet list $_.FullName package --vulnerable --include-transitive
            $report
            if ($report -match 'Critical' -or $report -match 'High') { $failed = $true }
          }
          if ($failed) { exit 1 }

  # Railway watches GitHub directly and deploys automatically.
  # "Wait for CI" is enabled on Railway so it only deploys after this workflow passes.
  # No explicit deploy step needed here.
