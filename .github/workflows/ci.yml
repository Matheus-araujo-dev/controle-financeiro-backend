name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

  test:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write
      issues: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # Credencial de um Postgres efêmero, isolado ao runner e destruído ao fim do job.
          # Sobrescrevível via secret; o fallback permite rodar o CI em forks sem o secret.
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'Strong_Passw0rd!' }}
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      CF_TEST_POSTGRES: "Host=localhost;Port=5432;Database={DB};Username=postgres;Password=${{ secrets.CI_POSTGRES_PASSWORD || 'Strong_Passw0rd!' }}"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Install local OCR runtime
        run: |
          sudo apt-get update && sudo apt-get install -y python3-venv python3-pil tesseract-ocr tesseract-ocr-por
          python3 -m venv --system-site-packages /tmp/invoice-python
          /tmp/invoice-python/bin/pip install "pypdf[crypto]==6.10.0"
          echo "/tmp/invoice-python/bin" >> "$GITHUB_PATH"

      - name: Test with coverage gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          ./scripts/coverage-gate.ps1 -Threshold 80 2>&1 | Tee-Object -FilePath TestResults/gate-output.txt

      - name: Post test failure details to PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BODY="## CI Test Failure Diagnostic\n\n"
          # Gate output (dotnet test stdout/stderr)
          if [ -f TestResults/gate-output.txt ]; then
            GATE_LAST=$(tail -100 TestResults/gate-output.txt)
            BODY+="### Gate Output (last 100 lines)\n\`\`\`\n${GATE_LAST}\n\`\`\`\n\n"
          fi
          # Find TRX files and extract failures
          for trx in $(find TestResults/coverage-collector -name '*.trx' 2>/dev/null); do
            FNAME=$(basename "$trx")
            TOTAL=$(grep -c 'outcome=' "$trx" 2>/dev/null || echo 0)
            FAILED_TESTS=$(grep -oP 'testName="[^"]*"[^>]*outcome="Failed"' "$trx" 2>/dev/null | grep -oP 'testName="\K[^"]*' || true)
            FAILED_TESTS2=$(grep -oP 'outcome="Failed"[^>]*testName="[^"]*"' "$trx" 2>/dev/null | grep -oP 'testName="\K[^"]*' || true)
            ALL_FAILED=$(echo -e "$FAILED_TESTS\n$FAILED_TESTS2" | sort -u | grep -v '^$')
            FCOUNT=$(echo "$ALL_FAILED" | grep -c . 2>/dev/null || echo 0)
            BODY+="**$FNAME**: $TOTAL results, $FCOUNT failed\n\n"
            echo "$ALL_FAILED" | head -30 | while read -r t; do
              [ -n "$t" ] && BODY+="\`$t\`\n"
            done
            # Extract error messages
            MSGS=$(python3 -c "
          import re, sys
          content = open('$trx').read()
          msgs = re.findall(r'<Message>(.*?)</Message>', content, re.DOTALL)
          for m in msgs[:10]:
              print(m[:500])
              print('---')
          " 2>/dev/null || true)
            if [ -n "$MSGS" ]; then
              BODY+="\n<details><summary>Error messages</summary>\n\n\`\`\`\n${MSGS}\n\`\`\`\n</details>\n\n"
            fi
          done
          # Coverage summary
          if [ -f TestResults/coverage-report/Summary.txt ]; then
            COV=$(head -30 TestResults/coverage-report/Summary.txt)
            BODY+="### Coverage\n\`\`\`\n${COV}\n\`\`\`\n"
          else
            BODY+="_No coverage report (tests failed before coverage)_\n"
          fi
          # Post comment via GitHub API
          ESCAPED=$(echo -e "$BODY" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            -d "{\"body\": $ESCAPED}" || true

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-results
          path: |
            TestResults/coverage-collector/**/*.trx
          if-no-files-found: ignore

      - name: Publish validated API contract
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: contracts/openapi.json
          if-no-files-found: error

      - name: Preserve coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: TestResults/coverage-report/
          if-no-files-found: error

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check vulnerable packages
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem src -Recurse -Filter *.csproj | ForEach-Object {
            $report = dotnet list $_.FullName package --vulnerable --include-transitive
            $report
            if ($report -match 'Critical' -or $report -match 'High') { $failed = $true }
          }
          if ($failed) { exit 1 }

  # Railway watches GitHub directly and deploys automatically.
  # "Wait for CI" is enabled on Railway so it only deploys after this workflow passes.
  # No explicit deploy step needed here.
